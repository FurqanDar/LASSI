name: Format

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C/H formatting (dry-run)
        run: |
          mapfile -d '' files < <(find src tests -type f \( -name '*.c' -o -name '*.h' \) -print0 | sort -z)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C/H sources under src/ or tests/"
            exit 1
          fi
          clang-format --dry-run --Werror -- "${files[@]}"
