name: Characterization

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lattice unit tests
        run: make unit-lattice

      - name: Run linker legality unit tests
        run: make unit-legal

      - name: Run isotropic energy unit tests
        run: make unit-energy

      - name: Run characterization harness
        run: make characterization
